[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mi*"]
exclude = [".venv*","__pycache__*","test"]

[project]
name = "mi"
version = "0.1.0"
description = "Microservice Interconnect"
authors = [
    {name = "Guilherme Araujo Thomaz", email = "guiaraujo@gta.ufrj.br"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.6"
dependencies = ["jsonschema==4.23.0","jsonschema-specifications==2023.12.1","pika==1.3.2"]

[project.urls]
"Homepage" = "https://github.com/Avadip-ROTA/mi"
